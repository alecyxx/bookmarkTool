{# 标签列表容器（整页与 fragment 共用）。 #}
<div class="manage-card">
  <div class="manage-card-actions">
    <button type="button" class="btn btn-primary" data-tag-new>+ 新建标签</button>
    <span class="text-secondary manage-hint">删除标签只删除标签与关联，不会删除任何书签。</span>
  </div>
  {% if tags %}
  <table class="table manage-table">
    <thead>
      <tr>
        <th scope="col">标签</th>
        <th scope="col">使用次数</th>
        <th scope="col" class="col-actions">操作</th>
      </tr>
    </thead>
    <tbody>
      {% for tag, count in tags %}
      <tr data-tag-id="{{ tag.id }}" data-version="{{ tag.version }}">
        <td><a class="tag-pill" href="/bookmarks?tag={{ tag.id }}">{{ tag.name }}</a></td>
        <td class="text-secondary">{{ count }}</td>
        <td class="col-actions">
          <button type="button" class="btn-link" data-tag-edit data-id="{{ tag.id }}">编辑</button>
          <button type="button" class="btn-link danger" data-tag-delete data-id="{{ tag.id }}">删除</button>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
  <div class="empty-state compact">
    <p class="empty-title">还没有标签</p>
    <p class="text-secondary">保存书签时可以顺便添加标签，也可以在这里统一管理。</p>
  </div>
  {% endif %}
</div>
