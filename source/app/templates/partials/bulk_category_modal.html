{# 批量修改分类 Modal。#}
<div class="modal fade" id="bulk-modal" tabindex="-1" aria-labelledby="bulk-title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="bulk-title">修改选中书签的分类</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
      </div>
      <div class="modal-body">
        <div class="modal-notice" role="alert" aria-live="assertive"></div>
        <div class="form-group">
          <label for="bulk-category-select">目标分类（替换当前分类）</label>
          <select class="form-select" id="bulk-category-select">
            {% for cid, path in options %}
            <option value="{{ cid if cid is not none else '' }}">{{ path }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-primary" id="bulk-submit-btn">应用</button>
      </div>
    </div>
  </div>
</div>
