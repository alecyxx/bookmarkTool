{# 批量添加标签 Modal。#}
<div class="modal fade" id="bulk-modal" tabindex="-1" aria-labelledby="bulk-title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="bulk-title">为选中书签添加标签</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
      </div>
      <div class="modal-body">
        <div class="modal-notice" role="alert" aria-live="assertive"></div>
        <div class="form-group">
          <label for="bulk-tags-input">标签（逗号分隔；只添加，不影响已有标签）</label>
          <input class="form-control" type="text" id="bulk-tags-input" autocomplete="off">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-primary" id="bulk-submit-btn">添加</button>
      </div>
    </div>
  </div>
</div>
